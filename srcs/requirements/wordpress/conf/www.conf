[www]
# The user and group that will run the WordPress processes
user = www-data
group = www-data

# The most important line: telling PHP to listen on port 9000
listen = 9000

# Process manager settings (How many workers to spawn)
pm = dynamic
pm.max_children = 25
pm.start_servers = 5
pm.min_spare_servers = 1
pm.max_spare_servers = 10

# Allow PHP to read Docker environment variables from your .env file
clear_env = no
