services:

  # MARIADB database service
  mariadb:
    build:
      context: ./requirements/mariadb 
      dockerfile: Dockerfile
    image: mariadb
    container_name: mariadb
    restart: always
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception_net
  
  # WORDPRESS (PHP-FPM) service
  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress
    container_name: wordpress
    restart: always
    depends_on:
      - mariadb
      - redis
    env_file:
      - .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wp_data:/var/www/html/wordpress
    networks:
      - inception_net

  # nginx service
  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    image: nginx
    container_name: nginx
    restart: always
    depends_on:
      - wordpress
    env_file:
      - .env
    ports:
      - "443:443"
    volumes:
      - wp_data:/var/www/html/wordpress
    networks:
      - inception_net


  ## ## ## ## ## ## #
  #   BONUS PART    #
  # ## # ## # ## ## #
         ##
       ######
        ####
         ##
  
  # adminer service
  adminer:
    build:
      context: ./requirements/bonus/adminer
      dockerfile: Dockerfile
    image: adminer
    container_name: adminer
    restart: always
    depends_on:
      - mariadb
    networks:
        - inception_net

  # ftp_server service
  ftp_server:
    build:
      context: ./requirements/bonus/ftp_server
      dockerfile: Dockerfile
    image: ftp_server
    container_name: ftp_server
    restart: always
    depends_on:
      - wordpress
    env_file:
      - .env
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    secrets:
      - ftp_password
    volumes:
      - wp_data:/var/www/html/wordpress
    networks:
        - inception_net

  # static_website service
  static_website:
    build:
      context: ./requirements/bonus/static_website
      dockerfile: Dockerfile
    image: static_website
    container_name: static_website
    restart: always
    networks:
        - inception_net

  # redis service
  redis:
    build:
      context: ./requirements/bonus/redis
      dockerfile: Dockerfile
    image: redis
    container_name: redis
    restart: always
    networks:
        - inception_net

  # portainer 
  portainer:
    build:
      context: ./requirements/bonus/portainer
      dockerfile: Dockerfile
    image: portainer
    container_name: portainer
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - inception_net

volumes:
    db_data:
      driver: local
      driver_opts:
          type: none
          o: bind
          device: ${HOME}/data/mariadb
    wp_data:
      driver: local
      driver_opts:
          type: none
          o: bind
          device: ${HOME}/data/wordpress
    portainer_data:

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt

networks:
    inception_net:
      driver: bridge
